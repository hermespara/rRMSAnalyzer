url: https://ribosomecrcl.github.io/rRMSAnalyzer/
template:
  bootstrap: 5
  bslib:
    bootswatch: flatly
    bootswatch_dark: darkly
    primary: "#22C55E"
    secondary: "#0EA5E9"
    success: "#16A34A"
    info: "#38BDF8"
    warning: "#F59E0B"
    danger: "#EF4444"
    base_font: {google: "Space Grotesk"}
    heading_font: {google: "Space Grotesk"}
    code_font: {google: "JetBrains Mono"}
    enable-rounded: true
    enable-shadows: true

navbar:
  structure:
    left: [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: "Get Started"
      href: articles/rRMSAnalyzer.html
    news:
      text: "News"
      href: news/index.html

reference:
  - title: Data Loading & Preparation
    desc: Functions to import RiboMethSeq data and create SummarizedExperiment objects.
    contents:
      - load_ribodata
      - create_se
      - ribo_toy

  - title: Annotation Management
    desc: Tools for managing rRNA 2'-O-methylation annotations.
    contents:
      - human_methylated
      - human_suspected
      - annotate_site
      - get_annotation
      - remove_annotation
      - keep_selected_annotation

  - title: Analysis & Computation
    desc: Core functions for C-score computation and bias adjustment.
    contents:
      - compute_cscore
      - adjust_bias
      - compute_window_score_cpp

  - title: Visualization
    desc: Explore methylation patterns with comprehensive plots.
    contents:
      - starts_with("plot_")
      - identify_rRNA_chains
      - view_pdb_chains
      - theme_rRMSAnalyzer
      - scale_color_rRMSAnalyzer
      - scale_fill_rRMSAnalyzer

  - title: Data Manipulation
    desc: Customize and export your data.
    contents:
      - show_rna_names
      - rename_rna
      - remove_rna
      - remove_samples
      - keep_samples
      - extract_data
      - format_to_plot
      - mean_samples_by_condition

  - title: Automated Reports
    desc: Generate QC and analysis reports.
    contents:
      - starts_with("report_")

  - title: Utilities
    desc: Helper functions.
    contents:
      - get_IQR
      - get_variant_sites
      - rRMSAnalyzer-package
